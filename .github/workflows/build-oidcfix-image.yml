name: Build OIDC-fix test image (1.28.1)

# Builds FreshRSS 1.28.1 + the OIDC state-timeout/default-url fix and
# publishes ghcr.io/<owner>/freshrss:oidcfix — byte-identical to the 1.28.1
# release image except for the two OIDC directives, so it is safe to point
# existing 1.28.1 data at (no schema drift).

on:
  push:
    branches:
      - test/oidcfix-1.28.1
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push Debian image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get FreshRSS version
        run: |
          FRESHRSS_VERSION=$(sed -n "s/^const FRESHRSS_VERSION = '\(.*\)'.*$/\1/p" constants.php)
          echo "FRESHRSS_VERSION=$FRESHRSS_VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/freshrss:oidcfix
          build-args: |
            FRESHRSS_VERSION=${{ env.FRESHRSS_VERSION }}
            SOURCE_COMMIT=${{ github.sha }}
