name: Build OIDC-fix test image

# Builds the Debian FreshRSS image from this branch and publishes it to
# ghcr.io/<owner>/freshrss:oidcfix so it can be tested in a real deployment.
# Separate from docker-publish.yml (which only publishes for the FreshRSS org).

on:
  push:
    branches:
      - fix/oidc-state-timeout-and-default-url
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push Debian image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Get FreshRSS version
        run: |
          FRESHRSS_VERSION=$(sed -n "s/^const FRESHRSS_VERSION = '\(.*\)'.*$/\1/p" constants.php)
          echo "FRESHRSS_VERSION=$FRESHRSS_VERSION" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/freshrss:oidcfix
          build-args: |
            FRESHRSS_VERSION=${{ env.FRESHRSS_VERSION }}
            SOURCE_COMMIT=${{ github.sha }}
